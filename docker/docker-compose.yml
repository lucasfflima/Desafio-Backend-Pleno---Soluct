version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: soluct_app
    volumes:
      - ../backend:/var/www
    working_dir: /var/www
    networks:
      - soluct_net

  web:
    image: nginx:alpine
    container_name: soluct_nginx
    depends_on:
      - app
    ports:
      - "8000:80"
    volumes:
      - ../backend:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - soluct_net

  db:
    image: postgres:15
    container_name: soluct_db
    restart: always
    environment:
      POSTGRES_DB: desafio_soluct
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - soluct_net

networks:
  soluct_net:

volumes:
  pgdata:
